<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Subtle Grid Pattern Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Central Logo Icon Mark -->
  <g transform="translate(600, 240)">
    <rect x="-160" y="-80" width="320" height="160" rx="28" fill="#141414" stroke="#2a2a2a" stroke-width="3"/>
    <text x="25" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="end" letter-spacing="-4">OEI</text>
    <path d="M45 -22 L85 14 L45 50" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Description -->
  <text x="600" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">Open Execution Intelligence</text>
  <text x="600" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="22" fill="#aaaaaa" text-anchor="middle">Execution-aware safety &amp; risk intelligence for terminal, CI, and AI agents</text>
</svg>
